name: Auto Sync Feishu to TXT

on:
  schedule:
    - cron: '0 18 * * *' # 每天北京时间凌晨2点自动跑一次（UTC时间18点）
  workflow_dispatch: # 随时手动触发开关

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Python script
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
        run: python convert.py

      - name: Commit and Push the TXT file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add SoupDatabase.txt
          git commit -m "API全自动同步飞书题库" || exit 0
          git push
